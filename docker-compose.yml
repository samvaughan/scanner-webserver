services:
  scan-app:
    build: .
    container_name: scan-app
    network_mode: host
    env_file:
      - path: stack.env
        required: false
    environment:
      CONSUME_DIR: /consume
    volumes:
      - /mnt/harddrive/scans/:/scans
      - /mnt/harddrive/paperless/consume:/consume
    restart: unless-stopped